# ============================================================
# deploy-rentmaszyny.yml
#
# Builds the RentMaszyny solution as MANAGED and deploys it to TST.
#
#   Pull request to main  -> Build stage only (validates that the solution packs)
#   Merge/push to main    -> Build -> Deploy to TST (after approval on the TST environment)
#
# The deployed artifact is the one built in the same run, so every TST deployment
# maps to exactly one commit and one solution version (= build number).
#
# One-time setup: see docs/alm.md
# ============================================================

name: 1.0.$(Date:yyyyMMdd)$(Rev:.r)   # also used as the solution version

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - solutions/RentMaszyny/**
      - webresources/**
      - pipelines/deploy-rentmaszyny.yml
      - config/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - solutions/RentMaszyny/**
      - webresources/**
      - pipelines/deploy-rentmaszyny.yml
      - config/**

parameters:
  # Stage-and-upgrade needs an existing base solution in TST. Tick this only for the very first
  # deployment (or after a TST reset); automatic PR/CI runs always use the default.
  - name: firstDeployment
    displayName: First deployment (RentMaszyny not installed in TST yet)
    type: boolean
    default: false

pool:
  vmImage: windows-latest

variables:
  solutionName: RentMaszyny
  solutionSourceFolder: $(Build.SourcesDirectory)/solutions/RentMaszyny/src
  managedZip: $(Build.ArtifactStagingDirectory)/RentMaszyny_managed.zip
  tstSettingsFile: config/deployment-settings.tst.json   # connection references (and env var values) for TST
  tstServiceConnection: PowerPlatform-TST   # Power Platform service connection name in ADO

stages:

  # ── Stage 1: Build ─────────────────────────────────────────────────────────
  - stage: Build
    displayName: Build managed solution
    jobs:
      - job: Pack
        displayName: Pack RentMaszyny (managed)
        steps:
          - checkout: self

          - task: PowerPlatformToolInstaller@2
            displayName: Install Power Platform Build Tools
            inputs:
              DefaultVersion: true

          # ── TypeScript web resources: test, build, inject into the solution ──
          - script: npm ci && npm test && npm run build
            displayName: Test and build TypeScript web resources
            workingDirectory: webresources

          # Every bundle in dist/ replaces the web resource with the same name in the solution.
          # The web resource must already exist in the solution (created once in DEV and synced),
          # otherwise it would not be registered on any form. Fail instead of skipping silently.
          - task: PowerShell@2
            displayName: Copy built web resources into the solution
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $target = "$(solutionSourceFolder)/WebResources"
                $bundles = Get-ChildItem "$(Build.SourcesDirectory)/webresources/dist/*.js"
                if (-not $bundles) { throw "No bundles found in webresources/dist" }
                foreach ($bundle in $bundles) {
                  $destination = Join-Path $target $bundle.BaseName
                  if (-not (Test-Path $destination)) {
                    throw "Web resource '$($bundle.BaseName)' is not in the solution. Create it in DEV, add it to RentMaszyny and run /solution-sync."
                  }
                  Copy-Item $bundle.FullName $destination -Force
                  Write-Host "Injected $($bundle.Name) -> WebResources/$($bundle.BaseName)"
                }

          # Stamp the build number into Solution.xml so TST shows which build is deployed.
          # Only the agent's working copy is changed; nothing is committed.
          - task: PowerShell@2
            displayName: Set solution version to $(Build.BuildNumber)
            inputs:
              pwsh: true            # PowerShell 7: utf8 without BOM
              targetType: inline
              script: |
                $path = "$(solutionSourceFolder)/Other/Solution.xml"
                $xml  = Get-Content $path -Raw
                $regex = [regex]'<Version>[^<]+</Version>'
                if (-not $regex.IsMatch($xml)) { throw "No <Version> element found in $path" }
                $xml = $regex.Replace($xml, "<Version>$(Build.BuildNumber)</Version>", 1)
                Set-Content -Path $path -Value $xml -NoNewline -Encoding utf8
                Write-Host "Solution version set to $(Build.BuildNumber)"

          - task: PowerPlatformPackSolution@2
            displayName: Pack managed solution
            inputs:
              SolutionSourceFolder: $(solutionSourceFolder)
              SolutionOutputFile: $(managedZip)
              SolutionType: Managed

          # Every connection reference in the solution needs a TST connection, otherwise its flows
          # cannot be turned on after import. Fail the build (and so the PR) instead of deploying them off.
          - task: PowerShell@2
            displayName: Check TST deployment settings
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $settings = Get-Content "$(Build.SourcesDirectory)/$(tstSettingsFile)" -Raw | ConvertFrom-Json
                [xml]$customizations = Get-Content "$(solutionSourceFolder)/Other/Customizations.xml" -Raw
                $references = @($customizations.ImportExportXml.connectionreferences.connectionreference |
                  Where-Object { $_ } | ForEach-Object { $_.connectionreferencelogicalname })
                $missing = foreach ($name in $references) {
                  $entry = $settings.ConnectionReferences | Where-Object { $_.LogicalName -eq $name }
                  if (-not $entry -or [string]::IsNullOrWhiteSpace($entry.ConnectionId)) { $name }
                }
                if ($missing) {
                  throw "No TST connection for: $($missing -join ', '). Set ConnectionId in $(tstSettingsFile) (docs/alm.md)."
                }
                Write-Host "TST connections set for: $($references -join ', ')"

          - task: CopyFiles@2
            displayName: Add TST deployment settings to the artifact
            inputs:
              SourceFolder: $(Build.SourcesDirectory)/config
              Contents: deployment-settings.tst.json
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publish solution artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: solution

  # ── Stage 2: Deploy to TST (acts as PROD) ─────────────────────────────────
  - stage: DeployTST
    displayName: Deploy to TST
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Import
        displayName: Import RentMaszyny (managed) into TST
        environment: TST            # approvals and checks are configured on this ADO environment
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs download pipeline artifacts automatically to $(Pipeline.Workspace)/<artifact>
                - task: PowerPlatformToolInstaller@2
                  displayName: Install Power Platform Build Tools
                  inputs:
                    DefaultVersion: true

                - task: PowerPlatformImportSolution@2
                  displayName: Import managed solution
                  inputs:
                    authenticationType: PowerPlatformSPN
                    PowerPlatformSPN: $(tstServiceConnection)
                    SolutionInputFile: $(Pipeline.Workspace)/solution/RentMaszyny_managed.zip
                    AsyncOperation: true
                    MaxAsyncWaitTime: "60"
                    # Stage-and-upgrade removes components that were deleted in DEV.
                    # A plain update would leave them behind in TST.
                    StageAndUpgrade: ${{ not(parameters.firstDeployment) }}
                    PublishWorkflows: true
                    OverwriteUnmanagedCustomizations: false
                    # Maps connection references to TST connections, so flows can be turned on.
                    UseDeploymentSettingsFile: true
                    DeploymentSettingsFile: $(Pipeline.Workspace)/solution/deployment-settings.tst.json
